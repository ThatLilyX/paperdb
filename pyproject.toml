[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperdb"
version = "0.1.0"
description = "Keep a folder of paper PDFs and a Notion database in step, keyed by citation key."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "click>=8.1", "pypdf>=4.0"]

[project.scripts]
paperdb = "paperdb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
